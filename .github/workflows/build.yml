name: Kernel Build (sdm439 4.19 + KSU)

on:
  workflow_dispatch:
    inputs:
      include_ksu:
        description: "Include KernelSU (static hooks)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source (Jprimero15 sdm439 4.19, ksu branch)
        uses: actions/checkout@v4
        with:
          repository: Jprimero15/android_kernel_xiaomi_sdm439-4.19
          ref: ksu
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison ccache curl flex gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libncurses-dev libssl-dev \
            zstd cmake ninja-build python3 python-is-python3 git zip

      - name: Download Neutron Clang
        run: |
          URL=$(curl -s https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest \
            | grep -oP '"browser_download_url":\s*"\K[^"]+\.tar\.zst' | head -n1)
          echo "Downloading $URL"
          curl -L "$URL" -o clang.tar.zst
          mkdir -p "$HOME/neutron"
          tar --zstd -xf clang.tar.zst -C "$HOME/neutron"
          echo "$HOME/neutron/bin" >> "$GITHUB_PATH"

      - name: Clone KernelSU
        if: ${{ inputs.include_ksu }}
        run: |
          rm -rf drivers/KernelSU
          git clone --depth=1 https://github.com/Jprimero15/KernelSU drivers/KernelSU
          test -d drivers/KernelSU/kernel || { echo "::error::drivers/KernelSU/kernel missing - fork layout mismatch"; exit 1; }
          ls drivers/KernelSU/kernel | head

      - name: Configure kernel (pine)
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          MAKE="make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=0 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          $MAKE KBUILD_DEFCONFIG=vendor/msm8937_defconfig defconfig
          CONFIGS="arch/arm64/configs/vendor/xiaomi-sdm439.config"
          if [ "${{ inputs.include_ksu }}" = "true" ]; then
            CONFIGS="$CONFIGS arch/arm64/configs/vendor/feature/ksu_static_hooks.config"
          fi
          printf 'CONFIG_KSU=%s\n' "${{ inputs.include_ksu && 'y' || 'n' }}" >> /tmp/extra.config
          scripts/kconfig/merge_config.sh -m -O out out/.config $CONFIGS /tmp/extra.config
          $MAKE olddefconfig
          grep -E "^CONFIG_KSU|^CONFIG_SCHED_WALT|^CONFIG_MACH_XIAOMI_PINE|^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE|^CONFIG_CC_IS_CLANG" out/.config || true

      - name: Build Image + dtbs
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          MAKE="make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=0 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- -j$(nproc)"
          $MAKE Image
          $MAKE arch/arm64/boot/dts/xiaomi-sdm439/sdm439-pine.dtb \
                arch/arm64/boot/dts/xiaomi-sdm439/sdm439-qrd-overlay-pine.dtbo
          ls -la out/arch/arm64/boot/Image out/arch/arm64/boot/dts/xiaomi-sdm439/*.dtb

      - name: Assemble Image.gz-dtb + dtbo.img
        run: |
          gzip -9 -c out/arch/arm64/boot/Image > Image.gz-dtb
          cat out/arch/arm64/boot/dts/xiaomi-sdm439/sdm439-pine.dtb >> Image.gz-dtb
          ls -la Image.gz-dtb
          git clone --depth=1 https://android.googlesource.com/platform/system/libufdt /tmp/libufdt
          make -j$(nproc) -C /tmp/libufdt/utils/src
          MKDTIMG=/tmp/libufdt/utils/src/mkdtimg
          OVERLAY=$(find out/arch/arm64/boot/dts/xiaomi-sdm439 -name "sdm439-qrd-overlay-pine.dtbo")
          test -n "$OVERLAY"
          "$MKDTIMG" create dtbo.img --dtb-overlays "$OVERLAY" --page_size 4096
          "$MKDTIMG" dump dtbo.img

      - name: Pack AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/AnyKernel3
          rm -rf /tmp/AnyKernel3/.git /tmp/AnyKernel3/.github
          cp Image.gz-dtb /tmp/AnyKernel3/Image.gz-dtb
          sed -i \
            -e 's/^kernel.string=.*/kernel.string=sdm439 4.19 KSU:${{ inputs.include_ksu }} for pine/' \
            -e 's/^is_slot_device=.*/is_slot_device=0;/' \
            -e 's|^# block=/dev/block/mmcblk0p21;|block=/dev/block/bootdevice/by-name/boot;|' \
            /tmp/AnyKernel3/anykernel.sh
          grep -q '^block=' /tmp/AnyKernel3/anykernel.sh || \
            sed -i '/^## AnyKernel setup/,/^##/s/^is_slot_device=/block=\/dev\/block\/bootdevice\/by-name\/boot;\nis_slot_device=/' /tmp/AnyKernel3/anykernel.sh
          tail -5 /tmp/AnyKernel3/anykernel.sh
          cd /tmp/AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/sdm439-kernel-pine-${{ inputs.include_ksu && 'ksu' || 'plain' }}-$(date +%Y%m%d).zip" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdm439-pine-${{ inputs.include_ksu && 'ksu' || 'plain' }}-${{ github.run_id }}
          path: |
            sdm439-kernel-*.zip
            dtbo.img
