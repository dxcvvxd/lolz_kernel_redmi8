name: Kernel Build (sdm439 4.19 + KSU)

on:
  workflow_dispatch:
    inputs:
      include_ksu:
        description: "Include KernelSU (static hooks)"
        type: boolean
        default: true
      source_ref:
        description: "Kernel branch (ksu = plain+KSU, lolz-v2 = LOLZ features)"
        type: string
        default: "ksu"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source (Jprimero15 sdm439 4.19)
        uses: actions/checkout@v4
        with:
          repository: Jprimero15/android_kernel_xiaomi_sdm439-4.19
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison ccache curl flex gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libncurses-dev libssl-dev \
            zstd cmake ninja-build python3 python-is-python3 git zip

      - name: Download Neutron Clang
        run: |
          URL=$(curl -s https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest \
            | grep -oP '"browser_download_url":\s*"\K[^"]+\.tar\.zst' | head -n1)
          echo "Downloading $URL"
          curl -L "$URL" -o clang.tar.zst
          mkdir -p "$HOME/neutron"
          tar --zstd -xf clang.tar.zst -C "$HOME/neutron"
          echo "$HOME/neutron/bin" >> "$GITHUB_PATH"

      - name: Clone or stub KernelSU Next
        run: |
          if [ "${{ inputs.include_ksu }}" = "true" ]; then
            rm -rf KernelSU-Next
            git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next KernelSU-Next
            test -f KernelSU-Next/kernel/Kconfig || { echo "::error::KernelSU-Next/kernel/Kconfig missing"; exit 1; }
            # tree wiring: drivers/kernelsu -> ../KernelSU/kernel ; retarget to Next
            rm -f drivers/kernelsu
            ln -s ../KernelSU-Next/kernel drivers/kernelsu
          else
            # drivers/kernelsu -> ../KernelSU/kernel (tree root); stub it for plain builds
            mkdir -p KernelSU/kernel
            printf 'config KSU\n\tbool "KernelSU"\n\tdefault n\n' > KernelSU/kernel/Kconfig
            printf 'obj-$(CONFIG_KSU) += \n' > KernelSU/kernel/Makefile
          fi

      - name: Configure kernel (pine)
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          MAKE="make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=0 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          $MAKE KBUILD_DEFCONFIG=vendor/msm8937_defconfig defconfig
          CONFIGS="arch/arm64/configs/vendor/xiaomi-sdm439.config"
          printf 'CONFIG_KSU=%s\n' "${{ inputs.include_ksu && 'y' || 'n' }}" >> /tmp/extra.config
          printf 'CONFIG_CORESIGHT=n\n' >> /tmp/extra.config
          if [ "${{ inputs.include_ksu }}" = "true" ]; then
            # KSU Next depends on KPROBES && EXT4_FS
            printf 'CONFIG_KPROBES=y\nCONFIG_HAVE_KPROBES=y\n' >> /tmp/extra.config
          fi
          scripts/kconfig/merge_config.sh -m -O out out/.config $CONFIGS /tmp/extra.config
          $MAKE olddefconfig
          grep -E "^CONFIG_KSU|^CONFIG_SCHED_WALT|^CONFIG_MACH_XIAOMI_PINE|^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE|^CONFIG_CC_IS_CLANG|^CONFIG_CORESIGHT" out/.config || true

      - name: Build Image
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=0 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- -j$(nproc) Image
          ls -la out/arch/arm64/boot/Image

      - name: Compile pine dtb + dtbo (no kbuild rules in 4.19)
        run: |
          DTC=out/scripts/dtc/dtc
          test -x "$DTC"
          X=arch/arm64/boot/dts/xiaomi-sdm439
          cpp -nostdinc -undef -D__DTS__ \
            -I $X -I $X/base -I include \
            -x assembler-with-cpp $X/sdm439-pine.dts > /tmp/pine.dts.tmp
          "$DTC" -O dtb -o sdm439-pine.dtb /tmp/pine.dts.tmp
          cpp -nostdinc -undef -D__DTS__ \
            -I $X -I $X/base -I include \
            -x assembler-with-cpp $X/sdm439-qrd-overlay-pine.dts > /tmp/pine-overlay.dts.tmp
          "$DTC" -@ -O dtb -o sdm439-qrd-overlay-pine.dtbo /tmp/pine-overlay.dts.tmp
          file sdm439-pine.dtb sdm439-qrd-overlay-pine.dtbo

      - name: Assemble Image.gz-dtb + dtbo.img
        run: |
          gzip -9 -c out/arch/arm64/boot/Image > Image.gz-dtb
          cat sdm439-pine.dtb >> Image.gz-dtb
          ls -la Image.gz-dtb
          MKDTIMG=scripts/mkdtboimg.py
          test -f sdm439-qrd-overlay-pine.dtbo
          python3 "$MKDTIMG" create dtbo.img --page_size=4096 sdm439-qrd-overlay-pine.dtbo
          python3 "$MKDTIMG" dump dtbo.img

      - name: Pack AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/AnyKernel3
          rm -rf /tmp/AnyKernel3/.git /tmp/AnyKernel3/.github
          cp Image.gz-dtb /tmp/AnyKernel3/Image.gz-dtb
          sed -i \
            -e 's/^kernel.string=.*/kernel.string=sdm439 4.19 KSU:${{ inputs.include_ksu }} for pine/' \
            -e 's/^is_slot_device=.*/is_slot_device=0;/' \
            -e 's|^# block=/dev/block/mmcblk0p21;|block=/dev/block/bootdevice/by-name/boot;|' \
            /tmp/AnyKernel3/anykernel.sh
          grep -q '^block=' /tmp/AnyKernel3/anykernel.sh || \
            sed -i '/^## AnyKernel setup/,/^##/s/^is_slot_device=/block=\/dev\/block\/bootdevice\/by-name\/boot;\nis_slot_device=/' /tmp/AnyKernel3/anykernel.sh
          tail -5 /tmp/AnyKernel3/anykernel.sh
          cd /tmp/AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/sdm439-kernel-pine-${{ inputs.include_ksu && 'ksu' || 'plain' }}-${{ inputs.source_ref }}-$(date +%Y%m%d).zip" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdm439-pine-${{ inputs.source_ref }}-${{ inputs.include_ksu && 'ksu' || 'plain' }}-${{ github.run_id }}
          path: |
            sdm439-kernel-*.zip
            dtbo.img
